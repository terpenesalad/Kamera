name: Build Kamera

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --stacktrace :core:test :app:assembleRelease 2>&1 | tee build.log

      - name: Report compile errors
        if: failure()
        run: |
          grep -E '^(e: |FAILURE|.*error:|\* What went wrong)' -A2 build.log | cut -c1-900 | head -40 | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done

      - name: Name the APK
        if: success()
        run: cp app/build/outputs/apk/release/app-release.apk "Kamera-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Kamera-1.0.${{ github.run_number }}
          path: Kamera-1.0.${{ github.run_number }}.apk

      - name: Publish release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" "Kamera-1.0.${{ github.run_number }}.apk" \
            --title "Kamera 1.0.${{ github.run_number }}" \
            --notes "Download the APK below on your phone to install or update Kamera." \
            --latest
